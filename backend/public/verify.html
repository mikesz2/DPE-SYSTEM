<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verificação DPE</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#142217;background:#07160c;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#234b2e 0,#0d2414 34%,#061108 70%);padding:24px}
    .wrap{width:min(720px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:#d8ead0}.brand img{width:50px;height:50px;object-fit:contain}.brand b{font-size:20px}.brand small{display:block;letter-spacing:2px;color:#8eaa87;font-size:8px;margin-top:3px}
    .card{background:linear-gradient(145deg,rgba(21,49,29,.96),rgba(10,27,16,.98));border:1px solid rgba(177,211,160,.22);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .status{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;letter-spacing:1px;color:#a5be9e}.status.ok{color:#bfe2a9}.status.bad{color:#ffaaa3}
    .body{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:28px}.avatar{height:210px;border-radius:20px;background:#cbdcba;display:grid;place-items:end center;overflow:hidden}.avatar img{max-width:160px;max-height:220px;object-fit:contain}
    h1{font-size:30px;margin:0 0 4px}.rank{font-size:13px;color:#b9d5ae;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px}.box small{display:block;color:#80947d;font-size:8px;letter-spacing:1px}.box strong{display:block;margin-top:5px;font-size:13px}
    .section{padding:0 28px 24px}.section h2{font-size:11px;letter-spacing:1px;color:#92ad8a;margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);padding:8px 10px;border-radius:999px;font-size:10px}
    .foot{padding:14px 28px;background:rgba(0,0,0,.16);font-size:9px;color:#71816d;display:flex;justify-content:space-between;gap:14px}
    .error{padding:40px 28px;text-align:center}.error b{font-size:24px}.error p{color:#91a08d}
    @media(max-width:620px){.body{grid-template-columns:1fr}.avatar{height:190px}.grid{grid-template-columns:1fr}.foot{flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img src="/assets/login/brasao-dpe-v2.png" alt=""><div><b>System DPE</b><small>IDENTIDADE DIGITAL VERIFICÁVEL</small></div></div>
    <section class="card" id="card"><div class="error"><b>Verificando...</b><p>Aguarde enquanto o System valida a credencial.</p></div></section>
  </main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
 const token=new URL(location.href).searchParams.get('credential')||'';
 const card=document.getElementById('card');
 if(!token){card.innerHTML='<div class="status bad">CREDENCIAL INVÁLIDA</div><div class="error"><b>QR sem credencial</b><p>Escaneie novamente o QR emitido pelo System DPE.</p></div>';return;}
 try{
  const r=await fetch('/api/identity/verify/'+encodeURIComponent(token),{cache:'no-store'}),data=await r.json();
  if(!r.ok)throw new Error(data.error||'Credencial inválida.');
  const m=data.member,certs=data.certifications||[],medals=data.medals||[];
  card.innerHTML='<div class="status ok">✓ CREDENCIAL VÁLIDA • DADOS CONSULTADOS AO VIVO</div>'+
  '<div class="body"><div class="avatar"><img src="'+esc(m.avatarUrl)+'" alt=""></div><div><h1>'+esc(m.nick)+'</h1><div class="rank">'+esc(m.rank)+' • '+esc(m.division?.sig||'Sem divisão')+'</div><div class="grid">'+
  '<div class="box"><small>SITUAÇÃO</small><strong>'+esc(m.status)+'</strong></div>'+
  '<div class="box"><small>DIVISÃO</small><strong>'+esc(m.division?.name||'—')+'</strong></div>'+
  '<div class="box"><small>ENTRADA</small><strong>'+new Date(m.joinedAt).toLocaleDateString('pt-BR')+'</strong></div>'+
  '<div class="box"><small>VERIFICADO EM</small><strong>'+new Date(data.verifiedAt).toLocaleString('pt-BR')+'</strong></div></div></div></div>'+
  '<div class="section"><h2>CERTIFICAÇÕES VÁLIDAS</h2><div class="chips">'+(certs.length?certs.map(x=>'<span class="chip">'+esc(x.title)+(x.expiresAt?' • até '+new Date(x.expiresAt).toLocaleDateString('pt-BR'):'')+'</span>').join(''):'<span class="chip">Nenhuma certificação ativa</span>')+'</div></div>'+
  '<div class="section"><h2>CONDECORAÇÕES</h2><div class="chips">'+(medals.length?medals.map(x=>'<span class="chip">'+esc(x.kind)+'</span>').join(''):'<span class="chip">Nenhuma condecoração ativa</span>')+'</div></div>'+
  '<div class="foot"><span>Emitida em '+new Date(data.credential.issuedAt).toLocaleString('pt-BR')+'</span><span>A validade é consultada no System em tempo real.</span></div>';
 }catch(e){card.innerHTML='<div class="status bad">✕ CREDENCIAL NÃO VÁLIDA</div><div class="error"><b>Não foi possível validar</b><p>'+esc(e.message)+'</p></div>';}
})();
</script>
</body></html>
